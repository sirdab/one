name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NX_DAEMON: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm nx run-many -t lint,typecheck,test,build
      - run: pnpm nx run verification:seo
      - run: pnpm nx run one:lint:tokens
      - run: pnpm nx run one:test:package
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx run verification:lookbook
      - run: pnpm nx run verification:consumers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/consumers/
            artifacts/lookbook/
          if-no-files-found: warn
          retention-days: 14
