name: Release alpha

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Verified main or a vX.Y.Z-alpha.N tag already on main
        required: true
        default: main
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-alpha
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.repository == 'sirdab/one'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify candidate with trusted main code
        id: verify
        run: node scripts/verify-release.mjs
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          GH_TOKEN: ${{ github.token }}

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'sirdab/one'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release-alpha
    permissions:
      contents: write
    env:
      NX_DAEMON: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm nx run-many -t lint,typecheck,test,build
      - run: pnpm nx run one:test:package
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx run verification:consumers
      - name: Attach the verified tarball to a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          version="$(node -p "require('./packages/one/package.json').version")"
          tag="v${version}"
          asset="artifacts/consumers/sirdab-one-${version}.tgz"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::${tag} is already released. Bump packages/one/package.json; released tarballs are never replaced."
            exit 1
          fi
          cp artifacts/consumers/verified-package.tgz "$asset"
          sha256="$(sha256sum "$asset" | cut -d' ' -f1)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/sirdab-one-${version}.tgz"
          printf 'Install:\n\n```json\n"@sirdab/one": "%s"\n```\n\nSHA-256: `%s`\nCommit: %s\n' "$url" "$sha256" "$SHA" > artifacts/consumers/release-notes.md
          gh release create "$tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --title "@sirdab/one ${version}" \
            --notes-file artifacts/consumers/release-notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-release-evidence
          path: artifacts/consumers/
          if-no-files-found: warn
          retention-days: 30
